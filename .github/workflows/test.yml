name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # worker-configuration.d.ts is gitignored (auto-generated, see .gitignore)
      # and required by tsconfig.json for both typecheck and the test run.
      # This only reads wrangler.jsonc locally — no Cloudflare auth needed.
      - name: Generate Worker types
        run: npx wrangler types

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx vitest run
